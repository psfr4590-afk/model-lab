name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # sentence-transformers and faiss-cpu make the first run slow (~5 min).
        # pip cache (keyed on requirements.txt hash) keeps subsequent runs fast.
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Test
        run: python -m pytest -q
