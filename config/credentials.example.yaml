# Credential metadata only. Secret values are intentionally absent.
credentials:
  - name: huggingface
    provider: Hugging Face
    kind: token
    env_var: HF_TOKEN
    description: Hugging Face Hub authentication for gated/private datasets.
  - name: github
    provider: GitHub
    kind: token
    env_var: GITHUB_TOKEN
    description: GitHub API authentication for repository crawling.
  - name: google
    provider: Google Programmable Search
    kind: api-key
    env_var: GOOGLE_API_KEY
    description: Google Custom Search API key.
  - name: google_cx
    provider: Google Programmable Search
    kind: search-engine-id
    env_var: GOOGLE_CX
    description: Google Programmable Search engine identifier.
