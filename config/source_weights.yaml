# ── Source Quality Weights ──────────────────────────────────────────────────
# weight > 1.0 = upsample (doc repeated N times)
# weight < 1.0 = downsample (doc kept with probability W)
# weight = 1.0 = pass through unchanged
#
# Signal scoring also gates crawling: sources scoring below signal_threshold
# are abandoned mid-crawl after min_pages_before_score pages.

signal_gate:
  enabled: true
  min_pages_before_score: 10    # crawl at least this many pages before scoring domain
  signal_threshold: 0.35        # abandon domain if rolling avg signal score < this
  window: 20                    # pages in rolling window

# ── Domain-level weights ────────────────────────────────────────────────────
# Matched in order; first match wins. Supports glob-style '*'.
domain_weights:

  # ── Tier 1: Highest signal (2.0–3.0) ─────────────────────────────────────
  - pattern: "arxiv.org"
    weight: 2.5
    category: research_paper
    notes: "Full papers and abstracts; extremely high density of structured reasoning"

  - pattern: "aclanthology.org"
    weight: 2.5
    category: research_paper

  - pattern: "openreview.net"
    weight: 2.2
    category: research_paper

  - pattern: "semanticscholar.org"
    weight: 2.0
    category: research_paper

  - pattern: "distill.pub"
    weight: 2.8
    category: research_paper
    notes: "Interactive ML papers; extremely high signal"

  - pattern: "ncbi.nlm.nih.gov"
    weight: 2.0
    category: research_paper

  - pattern: "github.com"
    weight: 2.0
    category: source_code
    notes: "Weighted further by stars/language in crawler"

  # ── Tier 2: High signal (1.5–2.0) ────────────────────────────────────────
  - pattern: "readthedocs.io"
    weight: 1.8
    category: documentation

  - pattern: "docs.python.org"
    weight: 1.8
    category: documentation

  - pattern: "developer.mozilla.org"
    weight: 1.8
    category: documentation

  - pattern: "wikipedia.org"
    weight: 1.5
    category: encyclopedia
    notes: "Good general knowledge; some noise in talk pages"

  - pattern: "stackoverflow.com"
    weight: 1.6
    category: technical_qa
    notes: "Questions + accepted answers only; skip low-score answers"

  - pattern: "stackexchange.com"
    weight: 1.5
    category: technical_qa

  - pattern: "paulgraham.com"
    weight: 1.8
    category: long_form_essay

  - pattern: "lilianweng.github.io"
    weight: 2.0
    category: research_blog

  - pattern: "huggingface.co/blog"
    weight: 1.6
    category: technical_blog

  - pattern: "huggingface.co"
    weight: 1.9
    category: dataset
    notes: "Catches the huggingface crawler's streamed dataset docs (domain-only match)"

  # ── Tier 3: Medium signal (1.0–1.5) ──────────────────────────────────────
  - pattern: "medium.com"
    weight: 0.9
    category: blog
    notes: "Highly variable quality; signal filter handles per-doc scoring"

  - pattern: "substack.com"
    weight: 1.0
    category: blog

  - pattern: "hackernews"
    weight: 0.8
    category: link_aggregator
    notes: "Comments only; high variance"

  - pattern: "reddit.com"
    weight: 0.4
    category: forum
    notes: "Only technical subreddits worth crawling at all"

  # ── Tier 4: Low signal / noise (< 1.0) ────────────────────────────────────
  - pattern: "twitter.com"
    weight: 0.1
    category: social_media
    notes: "Extremely noisy; avoid"

  - pattern: "facebook.com"
    weight: 0.05
    category: social_media

  - pattern: "instagram.com"
    weight: 0.0
    category: social_media

  - pattern: "tiktok.com"
    weight: 0.0
    category: social_media

  - pattern: "news.google.com"
    weight: 0.3
    category: news_aggregator

  - pattern: "*"
    weight: 0.8
    category: general_web
    notes: "Default catch-all"

# ── Content-type weights (applied on top of domain weight, multiplicative) ──
content_type_weights:
  source_code:      2.0    # .py, .rs, .go, .c, .cpp, .ts etc.
  research_paper:   2.0    # arxiv abstracts, full papers
  technical_doc:    1.8    # API docs, manuals, readthedocs
  framework_doc:    1.7    # torch, numpy, sklearn docs
  report:           1.6    # whitepapers, technical reports
  study:            1.6    # empirical studies, datasets papers
  encyclopedia:     1.4    # wikipedia articles
  textbook:         1.8    # structured educational content
  long_form_essay:  1.4    # well-structured essays > 2000 words
  technical_qa:     1.3    # SO questions+answers
  tutorial:         1.2    # how-to guides
  blog_post:        0.9    # general blog content
  news_article:     0.7    # news; low signal for reasoning tasks
  forum_post:       0.5    # reddit, HN comments
  social_media:     0.1    # tweets etc.
  unknown:          0.8    # unclassified

# ── Per-language weights for source code ─────────────────────────────────────
code_language_weights:
  python:     2.0
  rust:       1.9
  c:          1.8
  cpp:        1.8
  go:         1.7
  typescript: 1.6
  javascript: 1.3
  java:       1.4
  haskell:    1.8
  ocaml:      1.7
  zig:        1.8
  lua:        1.3
  bash:       1.2
  sql:        1.4
  r:          1.3
  julia:      1.5
  unknown:    1.0

# ── Quality signal heuristics (per-document scoring, 0.0–1.0) ────────────────
# A document's final weight = domain_weight * content_type_weight * quality_score
quality_heuristics:
  min_word_count: 50
  max_word_count: 100000
  min_avg_word_length: 3.5
  max_avg_word_length: 12.0
  min_unique_word_ratio: 0.2    # at least 20% unique words (catches repetitive spam)
  max_digit_ratio: 0.3          # mostly numeric content → low signal
  max_punctuation_ratio: 0.15
  max_uppercase_ratio: 0.3
  min_alpha_ratio: 0.6

  # Reward indicators (presence bumps score)
  reward_patterns:
    - "\\bfigure \\d+\\b"           # academic paper figures
    - "\\b(theorem|lemma|proof|corollary)\\b"
    - "\\b(abstract|introduction|conclusion|methodology)\\b"
    - "\\b(def |class |fn |func |function |impl )\\b"  # code keywords
    - "\\b(algorithm|complexity|runtime|O\\(n\\))\\b"
    - "\\b(dataset|experiment|baseline|benchmark|evaluation)\\b"
    - "\\breferences?\\b"

  # Penalize indicators (presence drops score)
  penalty_patterns:
    - "click here"
    - "sign up (now|today|free)"
    - "limited time offer"
    - "subscribe (now|to our newsletter)"
    - "\\bcookie policy\\b"
    - "all rights reserved"
    - "\\baffiliate\\b"
    - "\\bsponsored\\b"
    - "\\bad\\b"
