<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M²S Model Training Pipeline</title><style>
:root{--bg:#070b10;--panel:#0e151d;--panel2:#121c26;--line:#243442;--text:#e7eef6;--muted:#8295a8;--accent:#61d7ff;--ok:#71e3a0;--warn:#ffd166;--bad:#ff7070}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#070b10,#0b121a 55%,#071018);color:var(--text);font:13px/1.45 system-ui,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#091018;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh}.brand{font-size:19px;font-weight:850;letter-spacing:.04em}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.12em;margin-top:2px}.nav{margin-top:22px;display:grid;gap:5px}.nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--muted);padding:10px 12px;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.active{background:#12202b;border-color:#274355;color:var(--text)}.nav .ico{display:inline-block;width:23px}.sidefoot{position:absolute;bottom:14px;left:14px;right:14px;color:var(--muted);font-size:10px}.main{padding:22px;max-width:1550px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}.top h1{margin:0;font-size:21px}.sub{color:var(--muted)}.actions{display:flex;gap:7px}.btn{border:1px solid #315267;background:#13232e;color:var(--text);border-radius:7px;padding:8px 11px;cursor:pointer}.btn:hover{background:#193746}.primary{background:#16536b}.danger{border-color:#6e3c3c;background:#281719}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:11px}.card{background:rgba(14,21,29,.92);border:1px solid var(--line);border-radius:10px;padding:15px}.metric{font-size:25px;font-weight:800;margin-top:4px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.section{margin-top:14px}.section h2{font-size:14px;margin:0 0 10px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 8px;border-bottom:1px solid #1c2a35;text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}.stagegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stage{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px}.bar{height:5px;background:#1e2c38;border-radius:99px;overflow:hidden;margin:8px 0}.fill{height:100%;background:var(--accent)}pre.log{height:390px;overflow:auto;background:#05080c;border:1px solid var(--line);border-radius:9px;padding:12px;color:#b8c8d7;font:11px/1.5 ui-monospace,Consolas,monospace}.kv{display:grid;grid-template-columns:190px 1fr;gap:7px}.kv div:nth-child(odd){color:var(--muted)}input,select,textarea{width:100%;background:#080e14;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.span2{grid-column:1/-1}.pill{font-size:10px;border:1px solid #2c4656;border-radius:99px;padding:3px 7px;color:var(--accent)}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.sidefoot{position:static;margin-top:20px}.grid,.stagegrid,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.stagegrid,.formgrid{grid-template-columns:1fr}.main{padding:13px}.kv{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">M²S MODEL TRAINING PIPELINE<small>LOCAL COMMAND CENTER</small></div><div class="nav" id="nav"></div><div class="sidefoot">LOCALHOST ONLY · explicit actions required<br>Backend: FastAPI + existing pipeline</div></aside><main class="main"><div class="top"><div><div class="sub">M²S MODEL TRAINING PIPELINE CONTROL SURFACE</div><h1 id="pageTitle">Dashboard</h1></div><div class="actions"><button class="btn" onclick="refreshAll()">↻ Refresh</button><button class="btn danger" onclick="stopSelected()">Stop selected</button></div></div>
<section id="dashboard" class="page active"></section><section id="data" class="page"></section><section id="crawlers" class="page"></section><section id="pipeline" class="page"></section><section id="training" class="page"></section><section id="monitoring" class="page"></section><section id="credentials" class="page"></section><section id="system" class="page"></section><section id="settings" class="page"></section>
</main></div><script>
const pages=[['dashboard','▦','Dashboard'],['data','◫','Data'],['crawlers','◎','Crawlers'],['pipeline','▶','Pipeline'],['training','△','Training'],['monitoring','≋','Monitoring'],['credentials','⌁','Credentials'],['system','⚙','System'],['settings','☷','Settings']];let selected=null,ds=[],current=null;
const $=id=>document.getElementById(id); const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); const fmt=n=>{n=Number(n||0);return n<1024?(n+' B'):(n<1048576?(n/1024).toFixed(1)+' KB':(n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB'))};
pages.forEach(([id,ic,label])=>{let b=document.createElement('button');b.innerHTML=`<span class="ico">${ic}</span>${label}`;b.onclick=()=>show(id);$('nav').appendChild(b)});
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',pages[i][0]===id));$('pageTitle').textContent=pages.find(x=>x[0]===id)[2];renderPage(id)}
async function api(u,o){let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.json()}
async function refreshAll(){try{ds=await api('/api/datasets');if(selected==null&&ds.length)selected=ds[0].id;if(selected)current=await api('/api/datasets/'+selected);renderPage(document.querySelector('.page.active').id)}catch(e){console.error(e);}}
function renderPage(id){if(id==='dashboard')renderDash();if(id==='data')renderData();if(id==='crawlers')renderCrawlers();if(id==='pipeline')renderPipeline();if(id==='training')renderTraining();if(id==='monitoring')renderMonitoring();if(id==='credentials')loadCreds();if(id==='system')loadSystem();if(id==='settings')renderSettings()}
function select(id){selected=Number(id);refreshAll()}
function renderDash(){let running=ds.filter(d=>String(d.status).toLowerCase().includes('run')).length,total=ds.reduce((a,d)=>a+Number(d.stats?.documents||0),0);$('dashboard').innerHTML=`<div class="grid"><div class="card"><div class="sub">DATASET SESSIONS</div><div class="metric">${ds.length}</div></div><div class="card"><div class="sub">RUNNING</div><div class="metric ${running?'warn':'ok'}">${running}</div></div><div class="card"><div class="sub">DOCUMENTS</div><div class="metric">${total.toLocaleString()}</div></div><div class="card"><div class="sub">SELECTED</div><div class="metric">${current?String(current.id).padStart(3,'0'):'—'}</div></div></div><div class="section card"><h2>System posture</h2><div class="kv"><div>Control surface</div><div class="ok">ONLINE</div><div>Execution mode</div><div>Explicit action required</div><div>Backend</div><div>FastAPI / existing pipeline</div><div>Credential policy</div><div>Encrypted at rest, secrets not displayed</div></div></div><div class="section card"><h2>Pipeline</h2><div class="stagegrid">${stageCards(current)}</div></div>`}
function stageCards(d){if(!d)return '<div class="empty">No dataset selected.</div>';return Object.entries(d.stages||{}).map(([s,v])=>`<div class="stage"><b>${s.toUpperCase()}</b><div class="bar"><div class="fill" style="width:${v==='complete'?100:v==='running'?55:v==='failed'?20:0}%"></div></div><span class="pill">${esc(v)}</span></div>`).join('')}
function renderData(){ $('data').innerHTML=`<div class="card"><h2>Dataset sessions</h2><table class="table"><tr><th>ID</th><th>Name</th><th>Group</th><th>Status</th><th>Documents</th><th>Size</th><th>Action</th></tr>${ds.map(d=>`<tr><td>${String(d.id).padStart(3,'0')}</td><td>${esc(d.name)}</td><td>${esc(d.group_id||'custom')}</td><td>${esc(d.status)}</td><td>${Number(d.stats?.documents||0).toLocaleString()}</td><td>${fmt(d.stats?.bytes)}</td><td><button class="btn" onclick="select(${d.id})">Open</button></td></tr>`).join('')}</table></div>`}
function renderCrawlers(){let s=current?.stages?.crawl||'idle';$('crawlers').innerHTML=`<div class="grid"><div class="card"><div class="sub">CRAWL STATUS</div><div class="metric">${esc(s)}</div></div><div class="card"><div class="sub">DOCUMENTS</div><div class="metric">${Number(current?.stats?.documents||0).toLocaleString()}</div></div><div class="card"><div class="sub">FILES</div><div class="metric">${Number(current?.stats?.files||0).toLocaleString()}</div></div><div class="card"><div class="sub">SIZE</div><div class="metric">${fmt(current?.stats?.bytes)}</div></div></div><div class="section card"><h2>Dataset target</h2><p class="sub">Crawler execution is controlled through the existing pipeline runner. Opening this screen does not start a crawl.</p><button class="btn primary" onclick="runStage('crawl')">Start / resume crawl</button> <button class="btn danger" onclick="stopSelected()">Stop crawl</button></div><div class="section card"><h2>Crawler safety</h2><div class="kv"><div>Robots</div><div>Web crawler respects robots.txt</div><div>SSRF guard</div><div>Applied by WebCrawler; Google crawler remains a known audit gap</div><div>Credentials</div><div>Injected only through explicit environment mappings</div></div></div>`}
function renderPipeline(){ $('pipeline').innerHTML=`<div class="card"><h2>${current?esc(current.name):'No dataset selected'}</h2><div class="stagegrid">${current?Object.entries(current.stages||{}).map(([s,v])=>`<div class="stage"><b>${s.toUpperCase()}</b><div class="bar"><div class="fill" style="width:${v==='complete'?100:v==='running'?55:v==='failed'?20:0}%"></div></div><div class="sub">${esc(v)}</div><button class="btn primary" onclick="runStage('${s}')">${v==='complete'?'Run again':'Run'}</button></div>`).join(''):'<div class="empty">Create or select a dataset from Data.</div>'}</div></div>`}
function renderTraining(){let t=current?.training||{};$('training').innerHTML=`<div class="grid"><div class="card"><div class="sub">STATUS</div><div class="metric">${esc(t.status||'idle')}</div></div><div class="card"><div class="sub">DEVICE</div><div class="metric">${esc(t.device||'—')}</div></div><div class="card"><div class="sub">MODEL</div><div class="metric" style="font-size:15px">${esc(current?.model?.type||'85M target')}</div></div><div class="card"><div class="sub">PARAMETERS</div><div class="metric" style="font-size:18px">${Number(current?.model?.parameters||0).toLocaleString()}</div></div></div><div class="section card"><h2>Training control</h2><p class="sub">Training remains an explicit pipeline stage. The UI will not silently launch it.</p><button class="btn primary" onclick="runStage('train')">Start / resume training</button> <button class="btn danger" onclick="stopSelected()">Stop</button></div>`}
function renderMonitoring(){let ev=current?.events||[];$('monitoring').innerHTML=`<div class="card"><div class="sub">SELECTED DATASET</div><h2>${current?esc(current.name):'—'}</h2><pre class="log">${ev.map(e=>`[${esc(e.ts)}] ${esc(e.event)} ${esc(JSON.stringify(e.data))}`).join('\n')||'No events recorded.'}</pre></div>`}
async function loadCreds(){let cs=await api('/api/credentials');$('credentials').innerHTML=`<div class="card"><h2>Credential registry</h2><p class="sub">Metadata is visible. Secret values are never returned to the browser.</p><table class="table"><tr><th>Name</th><th>Provider</th><th>Type</th><th>Env</th><th>State</th><th>Actions</th></tr>${cs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.provider)}</td><td>${esc(c.type)}</td><td>${esc(c.env_var||'—')}</td><td>${c.environment_set?'<span class="ok">SET</span>':'<span class="warn">NOT SET</span>'}</td><td><button class="btn" onclick="testCred('${encodeURIComponent(c.name)}')">Test</button> <button class="btn danger" onclick="deleteCred('${encodeURIComponent(c.name)}')">Delete</button></td></tr>`).join('')}</table></div><div class="section card"><h2>Add / replace credential</h2><div class="formgrid"><input id="cn" placeholder="name, e.g. huggingface"><input id="cp" placeholder="provider, e.g. Hugging Face"><input id="ck" value="token" placeholder="type"><input id="ce" placeholder="env var, e.g. HF_TOKEN"><input id="cd" placeholder="description"><input id="ci" placeholder="identity (optional)"><input class="span2" id="cs" type="password" placeholder="secret / API key"><div class="span2"><button class="btn primary" onclick="saveCred()">Save encrypted credential</button></div></div></div>`}
async function saveCred(){let body={name:$('cn').value,provider:$('cp').value||'custom',kind:$('ck').value||'token',env_var:$('ce').value,description:$('cd').value,identity:$('ci').value,secret:$('cs').value};await api('/api/credentials',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});loadCreds()}
async function testCred(n){alert(JSON.stringify(await api('/api/credentials/'+n+'/test')))}async function deleteCred(n){if(confirm('Delete this credential?')){await api('/api/credentials/'+n,{method:'DELETE'});loadCreds()}}
async function loadSystem(){try{let s=await api('/api/system');$('system').innerHTML=`<div class="card"><h2>Host environment</h2><div class="kv">${Object.entries(s).map(([k,v])=>`<div>${esc(k)}</div><div>${esc(typeof v==='object'?JSON.stringify(v):v)}</div>`).join('')}</div></div>`}catch(e){$('system').innerHTML='<div class="card"><h2>System</h2><p class="bad">System endpoint unavailable.</p></div>'}}
function renderSettings(){$('settings').innerHTML=`<div class="card"><h2>Runtime configuration</h2><div class="kv"><div>Project root</div><div>./ (repository root)</div><div>API bind</div><div>localhost / 127.0.0.1</div><div>Pipeline flow</div><div>crawl → clean → dedup → weight → tokenize → shard → train → export</div><div>Model target</div><div>85M preset for GTX 1650 profile</div><div>Credentials</div><div>Windows DPAPI when available; Fernet fallback elsewhere</div></div></div><div class="section card"><h2>Safety posture</h2><p class="sub">No automatic crawl or training on UI startup. Keep the Command Center local. Populate credentials only through the encrypted store or an explicitly protected environment.</p></div>`}
async function runStage(s){if(!selected)return alert('Select a dataset first.');try{await api(`/api/datasets/${selected}/stage/${s}`,{method:'POST'});setTimeout(refreshAll,300)}catch(e){alert(e.message)}}async function stopSelected(){if(selected)await api(`/api/datasets/${selected}/stop`,{method:'POST'});refreshAll()}
refreshAll();setInterval(refreshAll,3000);
</script></body></html>
